name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip lld llvm

      - name: Install Neutron Clang
        run: |
          mkdir -p compiler
          cd compiler
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S


      - name: Build via build.sh
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Collect artifacts
        run: |
          mkdir -p artifacts

          if [ -f "out/arch/arm64/boot/Image" ]; then
            cp out/arch/arm64/boot/Image artifacts/kernel
          else
            echo "ERROR: kernel image not found (out/arch/arm64/boot/Image or Image.gz)"
            find out/arch/arm64/boot -maxdepth 2 -type f -name "Image*" -print || true
            exit 1
          fi

          DTBO_PATH="$(find out/arch/arm64/boot/dts/vendor/qcom -type f -name "dtbo.img" | head -n 1)"
          if [ -z "$DTBO_PATH" ]; then
            echo "ERROR: dtbo.img not found"
            exit 1
          fi
          cp "$DTBO_PATH" artifacts/dtbo.img

          DTB_PATH="$(find out/arch/arm64/boot/dts/vendor/qcom -type f -name "yupik.dtb" | head -n 1)"
          if [ -z "$DTB_PATH" ]; then
            echo "ERROR: yupik.dtb not found"
            exit 1
          fi
          cp "$DTB_PATH" artifacts/yupik.dtb

          ls -lah artifacts

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: Build-${{ github.run_id }}
          name: Build ${{ github.run_id }}
          draft: false
          prerelease: false
          files: |
            artifacts/kernel
            artifacts/dtbo.img
            artifacts/yupik.dtb

name: Build Scarlet Kernel (KVM + SukiSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      # Укажи тут свой репо, если исходников нет в корне этого экшена
      # with:
      #   repository: твоё/имя_репо
      #   ref: ветка
      #   path: kernel


    - name: Setup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip lld llvm
        
    - name: Install Neutron Clang
      run: |
        mkdir -p compiler
        cd compiler
        curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
        chmod +x antman
        ./antman -S

    - name: SukiSu
      run: |

        rm -rf drivers/kernelsu KernelSU
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

    - name: Configure Kernel & Remove QUIET
      run: |
        
        export KBUILD_BUILD_USER="Vjfgff"
        export KBUILD_BUILD_HOST="Redwood-Build"
        export PATH=$GITHUB_WORKSPACE/compiler/clang/bin:$PATH
        mkdir -p out
        
        # 1. ОБЪЕДИНЯЕМ КОНФИГИ (ПРАВИЛЬНЫЙ СПОСОБ)
        # Сначала копируем основной конфиг GKI
        cp arch/arm64/configs/vendor/xiaomi-qgki_defconfig out/.config
        # Затем дописываем в конец конфиг для нашего устройства (redwood)
        cat arch/arm64/configs/vendor/redwood.config >> out/.config
        # И говорим make "привести в порядок" получившуюся смесь
        make O=out ARCH=arm64 olddefconfig

        # 2. АВТОМАТИЧЕСКАЯ ПРАВКА DTS: УБИРАЕМ QUIET, ДОБАВЛЯЕМ DEBUG+KVM
        grep -rRl "bootargs" arch/arm64/boot/dts | xargs sed -i 's/quiet//g'
        grep -rRl "bootargs" arch/arm64/boot/dts | xargs sed -i 's|";| debug kvm-arm.mode=protected";|g'
        
        # 3. Настраиваем флаги ядра (.config)
        ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_MANUAL_HOOK \
            -d CONFIG_KPROBES \
            -d CONFIG_KPM \
            -d CONFIG_KALLSYMS_ALL \
            -e CONFIG_VIRTUALIZATION \
            -e CONFIG_KVM \
            -e CONFIG_PKVM_INTF \
            -e CONFIG_KVM_ARM_HOST \
            -e CONFIG_VHOST_NET \
            -e CONFIG_VSOCKETS \
            -d CONFIG_LTO_CLANG

        # 4. Финальное обновление конфига
        make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
        
    - name: Patch ReSukiSU (Manual Hooks)
      run: |
        
        # Проверяем, на месте ли драйвер, раз мы его не качаем
        if [ ! -d "drivers/kernelsu" ]; then
            echo "CRITICAL ERROR: ReSukiSU not found in drivers/kernelsu!"
            exit 1
        fi
        # Fix 1: Change struct assignment (.iterate = -> .iterate_shared =)
        sed -i 's/\.iterate\s*=\s*/.iterate_shared = /g' drivers/kernelsu/file_wrapper.c
        
        # Fix 2: Change member access (->iterate -> ->iterate_shared)
        # Using \b to ensure we match the word boundary, fixing both function calls AND the ternary check
        sed -i 's/->iterate\b/->iterate_shared/g' drivers/kernelsu/file_wrapper.c
        
    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/compiler/clang/bin:$PATH
        
        make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTLD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS="-Wno-implicit-function-declaration -Wno-int-conversion" \
            Image dtbs

    - name: Package AnyKernel3
      run: |
        
        git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        
        # Копируем Image
        cp out/arch/arm64/boot/Image AnyKernel3/
        
        # Копируем DTB/DTBO
        # ВАЖНО: Проверь, где лежат твои dtb. Для GKI они часто в vendor/qcom/
        find out/arch/arm64/boot/dts -name "dtbo.img" -exec cp {} AnyKernel3/ \;
        find out/arch/arm64/boot/dts -name "*redwood.dtb" -exec cp {} AnyKernel3/dtb \;
        
        # Правим имя версии
        sed -i "s/kernel.string=.*/kernel.string=Scarlet-KVM (ReSuki) Build/" AnyKernel3/anykernel.sh
        
        # ВАЖНО: Чтобы AnyKernel прошил DTB, иногда нужно указать это в anykernel.sh
        # Если у тебя стандартный AK3, он может не прошить dtb автоматически.
        
        cd AnyKernel3
        zip -r9 ../Scarlet-KVM-Redwood.zip * -x .git README.md *placeholder

    - name: Create Release and Upload Artifact
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        files: Scarlet-KVM-Redwood.zip
        tag_name: KVM-Test-Build-${{ github.run_id }}
        name: Scarlet KVM Test Build ${{ github.run_id }}
        draft: true # Черновик, чтобы ты мог его проверить перед публикацией
